<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="50%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#0d7a5f"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fee7"/>
      <stop offset="100%" stop-color="#e7eff8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#84cc16" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#d9f99d" stroke-width="8"/>
  
  <!-- Main Botanical Leaf Shape -->
  <g filter="url(#glow)">
    <path d="M 256 80 C 370 80 432 170 432 290 C 432 380 360 432 256 432 C 160 432 80 370 80 270 C 80 150 170 80 256 80 Z" fill="url(#leafGrad)"/>
    
    <!-- Central Leaf Spine / Scanner Ray -->
    <path d="M 256 120 Q 256 260 220 390" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Barcode Vertical Lines embedded into the leaf right side -->
    <rect x="270" y="160" width="8" height="180" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="290" y="180" width="14" height="150" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="316" y="170" width="6" height="165" rx="3" fill="#ffffff" opacity="0.95"/>
    <rect x="332" y="195" width="16" height="130" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="360" y="210" width="10" height="110" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="380" y="235" width="8" height="75" rx="4" fill="#ffffff" opacity="0.95"/>
    
    <!-- Reticle Corner Accent -->
    <path d="M 140 180 L 140 150 L 170 150" fill="none" stroke="#acf847" stroke-width="8" stroke-linecap="round"/>
    <path d="M 372 150 L 402 150 L 402 180" fill="none" stroke="#acf847" stroke-width="8" stroke-linecap="round"/>
    <path d="M 140 330 L 140 360 L 170 360" fill="none" stroke="#acf847" stroke-width="8" stroke-linecap="round"/>
    <path d="M 402 330 L 402 360 L 372 360" fill="none" stroke="#acf847" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
